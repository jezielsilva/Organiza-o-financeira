name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run lint

      - name: Run application build
        run: npm run build

  tests:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test

  python-validation:
    name: Python Invoice Parser Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/invoice_parser/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r microservices/invoice_parser/requirements.txt

      - name: Validate Python imports and syntax
        run: |
          python -c "import cv2, PIL, pydantic; print('Importações de Visão Computacional e Pydantic OK!')"
          python -m py_compile microservices/invoice_parser/parser.py
          echo "Sintaxe do parser.py verificada com sucesso!"

  docker-build:
    name: Docker Production Build
    needs: [typecheck-and-build, tests, python-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Production)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: controle-financeiro-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

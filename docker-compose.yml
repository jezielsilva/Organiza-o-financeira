name: controle-financeiro

# Atenção: o .env fica fora da imagem (.dockerignore). Sem as variáveis VITE_FIREBASE_*
# no momento do build, o app funciona normalmente, mas sem o compartilhamento.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle-financeiro-app
    restart: unless-stopped
    ports:
      - "3000:3000"
